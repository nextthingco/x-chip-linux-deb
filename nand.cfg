CONFIG_MTD=y
CONFIG_MTD_CMDLINE_PARTS=y
# Parse the fixed-partitions (incl. the rootfs `slc-mode;` flag) straight
# from the device tree. Without this only cmdline mtdparts= works, and the
# DT partitions are silently ignored -> the whole chip shows up as one mtd.
CONFIG_MTD_OF_PARTS=y
CONFIG_MTD_RAW_NAND=y
CONFIG_MTD_NAND_SUNXI=y
CONFIG_MTD_UBI=y
CONFIG_MISC_FILESYSTEMS=y
CONFIG_UBIFS_FS=y

# AXP209 PMIC USB power-supply chain, BUILT-IN, so the module-less FEL installer
# initramfs can bring up usb0. The OTG phy (phy-sun4i-usb) waits on the AXP209
# `usb-power` supply node (DT: /soc/i2c@1c2ac00/pmic@34/usb-power), driven by
# axp20x_usb_power (AXP20X_POWER), which reads VBUS via the AXP20X IIO ADC. armmp
# already builds in the i2c bus + axp20x mfd + regulator (=y), but ships the
# power-supply + ADC + IIO core as MODULES -> in the installer initramfs the
# supply never registers -> the (built-in) phy defers forever -> "WARN: usb0 not
# present" / "dnsmasq: unknown interface usb0". Forcing these =y closes the gap.
# (The i2c/mfd/regulator lines are kept as defensive pins in case armmp changes.)
CONFIG_I2C=y
CONFIG_I2C_MV64XXX=y
CONFIG_MFD_AXP20X=y
CONFIG_MFD_AXP20X_I2C=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_AXP20X=y
CONFIG_IIO=y
CONFIG_AXP20X_ADC=y
CONFIG_AXP20X_POWER=y

# OTG musb (built-in) so the NAND installer initramfs can bring up a USB-network
# gadget. MUST be DUAL_ROLE, not GADGET (peripheral-only): the CHIP dts sets the
# usb_otg node to `dr_mode = "otg"`, and sunxi_musb.c only compiles the
# USB_DR_MODE_OTG case under CONFIG_USB_MUSB_DUAL_ROLE -- with GADGET-only, "otg"
# hits the default branch and probe dies with "Invalid or missing 'dr_mode'
# property" (-EINVAL) -> no usb0. This matches sunxi_defconfig, which got
# dual-role by default from USB=y + USB_GADGET=y. DUAL_ROLE also REQUIRES the USB
# host core built-in (Kconfig: depends on USB=y), so force CONFIG_USB=y too
# (armmp ships it =m). (This regressed when we moved sunxi_defconfig -> armmp.)
CONFIG_USB=y
CONFIG_USB_MUSB_HDRC=y
CONFIG_USB_MUSB_SUNXI=y
CONFIG_USB_MUSB_DUAL_ROLE=y
CONFIG_PHY_SUN4I_USB=y
CONFIG_NOP_USB_XCEIV=y

# Gadget framework + configfs-composed RNDIS (what x-chip-tools/init builds).
CONFIG_USB_GADGET=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_U_ETHER=y

# DIP display bridges off TCON0's parallel RGB output (chip-dt-overlays applies
# the matching overlay at boot). armmp builds DRM_SUN4I but not these external
# bridges: HDMI DIP = Chrontel CH7033 RGB->HDMI (i2c), VGA DIP = a dumb resistor
# DAC ("dumb-vga-dac").
# BUILT-IN (=y), not modules: sun4i_tcon's RGB init does NOT defer when it finds
# no bridge -- it logs "No panel or bridge found... RGB output disabled" and gives
# up. As modules these bridges autoload too late (after DRM_SUN4I has already
# probed the tcon), so RGB stays dead and there's no connector/CRTC (=> no signal,
# X can't open a screen). Built-in, the bridge driver is registered at boot before
# DRM_SUN4I probes, so the tcon finds it. (Confirmed on the VGA DIP.)
#
# CRITICAL: the bridges can only be =y if the DRM core + sun4i are =y too. They
# depend on DRM and `select DRM_KMS_HELPER`; a built-in symbol cannot select a
# modular one, so with armmp's DRM=m / DRM_SUN4I=m, kconfig SILENTLY DEMOTES the
# two bridge lines back to =m at oldconfig time (no error, build succeeds, shipped
# config reads =m -- which was exactly the bug here). Forcing the core =y lets the
# =y stick; the KMS/DMA helpers get auto-promoted to =y by DRM_SUN4I's selects.
CONFIG_DRM=y
CONFIG_DRM_SUN4I=y
CONFIG_DRM_CHRONTEL_CH7033=y
CONFIG_DRM_SIMPLE_BRIDGE=y
# ...and the whole downstream chain must be built-in too, for the same reason.
# The mainline "dumb-vga-dac" (simple-bridge) is NOT a leaf: its probe HARD-FAILS
# with -EPROBE_DEFER until it finds the bridge on its port@1 -- which is the VGA
# overlay's `vga-connector`, driven by display-connector. With that =m, the dac
# defers waiting for the not-yet-loaded module; sun4i_rgb_init then sees the defer,
# does NOT propagate it (treats any error as "no bridge", disables RGB, returns 0),
# and gives up before the module ever loads. Built-in, the connector registers at
# boot so the dac resolves on its first probe and sun4i finds the live chain.
# (The old NextThing "dumb-vga-bridge" was a leaf with no connector node, so it
# never had this second-level dependency.)
# display-connector also drives the HDMI DIP's `hdmi-connector` node, and the
# ch7033 bridge has the identical port@1 next-bridge requirement, so this one
# symbol covers both DIPs.
CONFIG_DRM_DISPLAY_CONNECTOR=y

# i2c-gpio bitbang bus for the EXPERIMENTAL HDMI DIP variant
# (x-chip-dip-hdmi-gpio.dtbo): the sunxi mv64xxx controller loses arbitration the
# instant it reads the ch7033, so that overlay puts the bridge + DDC on a software
# i2c-gpio bus on the same TWI1 pins. armmp currently defaults this =y, but the
# overlay hard-depends on it -- pin it so an armmp change can't silently break the
# fallback (the hw-i2c variant uses I2C_MV64XXX, already pinned above).
CONFIG_I2C_GPIO=y
